name: CloudBrowser — Build .wpk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Write package.json
        run: |
          cat > package.json << 'EOF'
          {
            "name": "cloud-browser",
            "version": "1.0.0",
            "main": "main.js",
            "scripts": {
              "build": "electron-builder --linux --x64"
            },
            "build": {
              "appId": "com.cloudbrowser.app",
              "productName": "CloudBrowser",
              "directories": { "output": "dist" },
              "files": ["main.js", "preload.js", "renderer.html"],
              "linux": {
                "target": [{ "target": "AppImage", "arch": ["x64"] }],
                "category": "Network"
              }
            },
            "devDependencies": {
              "electron": "^29.0.0",
              "electron-builder": "^24.0.0"
            }
          }
          EOF

      - name: Write preload.js
        run: |
          cat > preload.js << 'EOF'
          const { contextBridge, ipcRenderer } = require('electron');
          contextBridge.exposeInMainWorld('cb', {
            send: (ch, data) => ipcRenderer.send(ch, data || {}),
            on:   (ch, fn)   => {
              const h = (_, ...a) => fn(...a);
              ipcRenderer.on(ch, h);
              return () => ipcRenderer.removeListener(ch, h);
            }
          });
          EOF

      - name: Write main.js
        run: |
          cat > main.js << 'EOF'
          const { app, BrowserWindow, BrowserView, ipcMain, session } = require('electron');
          const path = require('path');

          const views = {};
          let win;
          let activeId = null;

          function createWindow() {
            win = new BrowserWindow({
              width: 1280, height: 800, minWidth: 800, minHeight: 500,
              frame: false, backgroundColor: '#0b1a2e',
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                contextIsolation: true,
                nodeIntegration: false,
              }
            });
            win.loadFile('renderer.html');
            win.on('resize', () => {
              if (activeId && views[activeId]) resize(views[activeId]);
            });
          }

          function resize(v) {
            if (!win || !v) return;
            const [w, h] = win.getContentSize();
            v.setBounds({ x: 0, y: 86, width: w, height: h - 86 });
          }

          function hideAll() {
            Object.values(views).forEach(v => { try { win.removeBrowserView(v); } catch(_){} });
          }

          ipcMain.on('tab-create', (_, { tabId, url }) => {
            const v = new BrowserView({
              webPreferences: {
                nodeIntegration: false, contextIsolation: true,
                partition: 'persist:main',
                userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
              }
            });
            views[tabId] = v;
            v.webContents.on('did-start-loading', () => win.webContents.send('nav-loading', { tabId, loading: true }));
            v.webContents.on('did-stop-loading',  () => {
              win.webContents.send('nav-loading', { tabId, loading: false });
              win.webContents.send('nav-update', {
                tabId, url: v.webContents.getURL(), title: v.webContents.getTitle(),
                canBack: v.webContents.canGoBack(), canFwd: v.webContents.canGoForward()
              });
            });
            v.webContents.on('page-title-updated', (_, t) => win.webContents.send('nav-title', { tabId, title: t }));
            v.webContents.on('did-navigate',        (_, u) => win.webContents.send('nav-url',   { tabId, url: u }));
            v.webContents.on('did-navigate-in-page',(_, u) => win.webContents.send('nav-url',   { tabId, url: u }));
            v.webContents.setWindowOpenHandler(({ url: u }) => { win.webContents.send('open-new-tab', { url: u }); return { action: 'deny' }; });
            if (url && url !== 'cloud://home') v.webContents.loadURL(url).catch(() => {});
          });

          ipcMain.on('tab-activate', (_, { tabId }) => {
            activeId = tabId; hideAll();
            const v = views[tabId];
            if (v) { win.addBrowserView(v); resize(v); }
          });

          ipcMain.on('tab-close', (_, { tabId }) => {
            const v = views[tabId]; if (!v) return;
            try { win.removeBrowserView(v); } catch(_) {}
            v.webContents.destroy(); delete views[tabId];
          });

          ipcMain.on('nav-go', (_, { tabId, url }) => {
            const v = views[tabId]; if (!v) return;
            if (!url || url === 'cloud://home') { try { win.removeBrowserView(v); } catch(_){} return; }
            win.addBrowserView(v); resize(v);
            v.webContents.loadURL(url).catch(err => win.webContents.send('nav-error', { tabId, error: err.message }));
          });

          ipcMain.on('nav-back',   (_, { tabId }) => views[tabId]?.webContents.goBack());
          ipcMain.on('nav-fwd',    (_, { tabId }) => views[tabId]?.webContents.goForward());
          ipcMain.on('nav-reload', (_, { tabId }) => views[tabId]?.webContents.reload());
          ipcMain.on('nav-stop',   (_, { tabId }) => views[tabId]?.webContents.stop());
          ipcMain.on('nav-home',   (_, { tabId }) => {
            const v = views[tabId]; if (v) try { win.removeBrowserView(v); } catch(_) {}
            win.webContents.send('show-home', { tabId });
          });
          ipcMain.on('win-minimize', () => win.minimize());
          ipcMain.on('win-maximize', () => win.isMaximized() ? win.unmaximize() : win.maximize());
          ipcMain.on('win-close',    () => win.close());
          ipcMain.on('devtools',     (_, { tabId }) => views[tabId]?.webContents.openDevTools());

          app.whenReady().then(() => {
            session.defaultSession.setPermissionRequestHandler((_, p, cb) =>
              cb(['notifications','geolocation','clipboard-read'].includes(p))
            );
            createWindow();
            app.on('activate', () => { if (!BrowserWindow.getAllWindows().length) createWindow(); });
          });
          app.on('window-all-closed', () => { if (process.platform !== 'darwin') app.quit(); });
          EOF

      - name: Write renderer.html
        run: |
          cat > renderer.html << 'REOF'
          <!DOCTYPE html>
          <html lang="tr">
          <head>
          <meta charset="UTF-8">
          <title>CloudBrowser</title>
          <style>
          *{margin:0;padding:0;box-sizing:border-box}
          :root{--sky:#0b1a2e;--tb:#0d2040;--tabs:#091528;--glass:rgba(255,255,255,0.06);--brd:rgba(255,255,255,0.1);--blue:#4fa3e3;--cyan:#38c9e8;--green:#40dc80;--text:#dceeff;--muted:rgba(180,220,255,0.55)}
          html,body{height:100%;overflow:hidden;background:var(--sky);color:var(--text);font-family:system-ui,sans-serif;user-select:none}
          body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 20% 10%,rgba(30,80,160,0.4),transparent 60%),radial-gradient(ellipse 60% 40% at 80% 5%,rgba(20,60,130,0.3),transparent 55%)}
          .clouds{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
          .cloud{position:absolute;border-radius:50%;filter:blur(40px);opacity:.07;animation:drift linear infinite}
          .c1{width:500px;height:160px;background:#a0c8f0;top:2%;animation-duration:60s}
          .c2{width:380px;height:120px;background:#c0d8f8;top:12%;animation-duration:80s;animation-delay:-30s}
          @keyframes drift{from{transform:translateX(-600px)}to{transform:translateX(calc(100vw + 600px))}}
          #shell{position:relative;z-index:10;display:flex;flex-direction:column;height:100vh}
          .drag{-webkit-app-region:drag} .no-drag{-webkit-app-region:no-drag}
          #tab-bar{height:36px;display:flex;align-items:flex-end;padding:4px 8px 0;gap:2px;background:var(--tabs);border-bottom:1px solid var(--brd);flex-shrink:0;overflow:hidden}
          #win-ctrl{display:flex;align-items:center;gap:6px;margin-right:10px;padding-bottom:4px}
          .wc{width:13px;height:13px;border-radius:50%;cursor:pointer;flex-shrink:0;transition:filter .15s}
          .wc:hover{filter:brightness(1.2)} .wc-x{background:#ff5f57} .wc-m{background:#febc2e} .wc-z{background:#28c840}
          #tabs{display:flex;align-items:flex-end;gap:2px;flex:1;overflow:hidden}
          .tab{display:flex;align-items:center;gap:5px;min-width:100px;max-width:180px;height:28px;padding:0 10px;border-radius:6px 6px 0 0;background:var(--glass);border:1px solid var(--brd);border-bottom:none;cursor:pointer;font-size:11.5px;color:var(--muted);white-space:nowrap;transition:all .12s;flex-shrink:0}
          .tab:hover{background:rgba(255,255,255,0.09);color:var(--text)}
          .tab.active{background:rgba(79,163,227,0.2);border-color:rgba(79,163,227,0.5);color:var(--text);font-weight:500}
          .ti{font-size:12px;flex-shrink:0} .tl{flex:1;overflow:hidden;text-overflow:ellipsis}
          .sp{width:12px;height:12px;border:1.5px solid rgba(79,163,227,0.3);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;display:none}
          .tab.loading .sp{display:block} .tab.loading .ti{display:none}
          .tx{width:16px;height:16px;border-radius:3px;font-size:10px;display:flex;align-items:center;justify-content:center;opacity:0;transition:all .12s;flex-shrink:0}
          .tab:hover .tx,.tab.active .tx{opacity:.6} .tx:hover{background:rgba(255,80,80,0.35);opacity:1!important}
          #nt{height:28px;padding:0 10px;border-radius:6px 6px 0 0;background:transparent;border:1px solid transparent;border-bottom:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;flex-shrink:0;transition:color .12s}
          #nt:hover{color:var(--blue)}
          @keyframes spin{to{transform:rotate(360deg)}}
          #toolbar{height:50px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--tb);border-bottom:1px solid var(--brd);flex-shrink:0}
          .btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--brd);border-radius:8px;cursor:pointer;color:var(--muted);font-size:15px;transition:all .12s;flex-shrink:0}
          .btn:hover{background:rgba(255,255,255,0.1);color:var(--text)} .btn:active{transform:scale(.93)}
          .btn.dis{opacity:.25;pointer-events:none}
          #urlw{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.35);border:1px solid var(--brd);border-radius:20px;padding:0 14px;height:34px;transition:all .2s;cursor:text}
          #urlw:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,163,227,0.12);background:rgba(5,15,35,0.6)}
          #proto{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:4px;flex-shrink:0}
          .ph{color:var(--green);background:rgba(64,220,128,0.12)} .pp{color:#f0c060;background:rgba(240,192,96,0.12)} .pc{color:var(--cyan);background:rgba(56,201,232,0.12)}
          #ui{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:ui-monospace,monospace;font-size:12.5px;caret-color:var(--blue)}
          #ui::placeholder{color:var(--muted)}
          #gb{padding:4px 14px;background:rgba(79,163,227,0.18);border:1px solid rgba(79,163,227,0.35);border-radius:14px;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;flex-shrink:0}
          #gb:hover{background:rgba(79,163,227,0.3)}
          #content{flex:1;position:relative;overflow:hidden}
          #home{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;overflow-y:auto;text-align:center}
          .logo{font-size:52px;filter:drop-shadow(0 0 22px rgba(79,163,227,0.5));margin-bottom:10px}
          .lt{font-size:32px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#dceeff,#4fa3e3 50%,#38c9e8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
          .ls{font-size:10px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:32px}
          #sb{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(79,163,227,0.3);border-radius:50px;padding:12px 18px;width:100%;max-width:520px;margin-bottom:28px;transition:all .25s}
          #sb:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px rgba(79,163,227,0.12);background:rgba(79,163,227,0.06)}
          #si{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px}
          #si::placeholder{color:var(--muted)}
          #sbt{padding:8px 20px;background:var(--blue);border:none;border-radius:25px;color:#fff;font-size:13px;font-weight:700;cursor:pointer}
          #sbt:hover{background:#3a8fd4}
          .qg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;width:100%}
          .qi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--glass);border:1px solid var(--brd);border-radius:10px;cursor:pointer;font-size:11px;color:var(--muted);transition:all .2s}
          .qi:hover{background:rgba(255,255,255,0.09);color:var(--text);transform:translateY(-2px);border-color:rgba(79,163,227,0.4)}
          .qi span:first-child{font-size:24px}
          #statusbar{height:22px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(7,14,26,0.98);border-top:1px solid var(--brd);font-size:10.5px;color:var(--muted);font-family:ui-monospace,monospace;flex-shrink:0}
          #sd{width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;display:inline-block}
          .st{padding:1px 6px;border-radius:3px;background:rgba(79,163,227,0.12);color:var(--blue);font-size:10px}
          </style>
          </head>
          <body>
          <div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div></div>
          <div id="shell">
            <div id="tab-bar" class="drag">
              <div id="win-ctrl" class="no-drag">
                <div class="wc wc-x" onclick="s('win-close')"></div>
                <div class="wc wc-m" onclick="s('win-minimize')"></div>
                <div class="wc wc-z" onclick="s('win-maximize')"></div>
              </div>
              <div id="tabs" class="no-drag"></div>
              <div id="nt" class="no-drag" onclick="newTab()" title="Ctrl+T">+</div>
            </div>
            <div id="toolbar" class="no-drag">
              <div class="btn dis" id="bb" onclick="nav('back')"   title="Geri">&#8592;</div>
              <div class="btn dis" id="bf" onclick="nav('fwd')"    title="İleri">&#8594;</div>
              <div class="btn"     id="br" onclick="nav('reload')" title="Yenile">&#8635;</div>
              <div class="btn"          onclick="nav('home')"  title="Ana Sayfa">&#8962;</div>
              <div id="urlw" onclick="document.getElementById('ui').focus()">
                <span id="proto" class="pc">cloud</span>
                <input id="ui" placeholder="Adres gir veya ara..." spellcheck="false" value="cloud://home" onfocus="this.select()" onkeydown="if(event.key==='Enter')navigate()">
                <button id="gb" onclick="navigate()">Git</button>
              </div>
              <div class="btn" onclick="s('devtools',{tabId:aTab})" title="DevTools">🛠</div>
            </div>
            <div id="content">
              <div id="home">
                <div class="logo">☁️</div>
                <div class="lt">CloudBrowser</div>
                <div class="ls">Chromium Tabanlı · .wpk Destekli</div>
                <div id="sb">
                  <span style="color:var(--muted);font-size:16px">🔍</span>
                  <input id="si" placeholder="Google'da ara veya URL gir..." onkeydown="if(event.key==='Enter')hs()">
                  <button id="sbt" onclick="hs()">Ara</button>
                </div>
                <div class="qg">
                  <div class="qi" onclick="go('https://www.youtube.com')"><span>▶️</span><span>YouTube</span></div>
                  <div class="qi" onclick="go('https://www.google.com')"><span>🌐</span><span>Google</span></div>
                  <div class="qi" onclick="go('https://github.com')"><span>🐙</span><span>GitHub</span></div>
                  <div class="qi" onclick="go('https://www.instagram.com')"><span>📸</span><span>Instagram</span></div>
                  <div class="qi" onclick="go('https://twitter.com')"><span>🐦</span><span>Twitter/X</span></div>
                  <div class="qi" onclick="go('https://www.reddit.com')"><span>🔴</span><span>Reddit</span></div>
                  <div class="qi" onclick="go('https://www.netflix.com')"><span>🎬</span><span>Netflix</span></div>
                  <div class="qi" onclick="newTab()"><span>➕</span><span>Yeni Sekme</span></div>
                </div>
              </div>
            </div>
            <div id="statusbar">
              <div><span id="sd"></span><span id="sm">Hazır</span>&nbsp;<span class="st">.wpk</span>&nbsp;<span class="st">Chromium</span></div>
              <div id="clk" style="opacity:.6"></div>
            </div>
          </div>
          <script>
          let aTab=null,tN=0;const tm={};
          setInterval(()=>{document.getElementById('clk').textContent=new Date().toLocaleTimeString('tr-TR')},1000);
          function s(ch,d){window.cb.send(ch,d||{})}
          function sp(u){const p=document.getElementById('proto');if(u.startsWith('https')){p.textContent='https';p.className='ph'}else if(u.startsWith('http')){p.textContent='http';p.className='pp'}else{p.textContent='cloud';p.className='pc'}}
          function ss(m,c){const e=document.getElementById('sm');e.textContent=m;e.style.color=c||'';if(c)setTimeout(()=>{e.textContent='Hazır';e.style.color=''},3000)}
          function host(u){try{return new URL(u).hostname}catch(_){return u}}
          function ru(r){if(!r)return'cloud://home';if(/^(https?|cloud):\/\//.test(r))return r;if(/^[\w-]+\.[\w.-]+/.test(r))return'https://'+r;return'https://www.google.com/search?q='+encodeURIComponent(r)}
          function showHome(){document.getElementById('home').style.display='flex';sp('cloud://home');document.getElementById('ui').value='cloud://home';document.getElementById('bb').classList.add('dis');document.getElementById('bf').classList.add('dis');ss('Hazır')}
          function hidHome(){document.getElementById('home').style.display='none'}
          function newTab(url){tN++;const id='t'+tN;tm[id]={url:url||'cloud://home'};const el=document.createElement('div');el.className='tab';el.id='TT'+id;el.innerHTML=`<span class="ti">☁️</span><div class="sp"></div><span class="tl">Yeni Sekme</span><span class="tx" onclick="ct(event,'${id}')">✕</span>`;el.onclick=e=>{if(!e.target.classList.contains('tx'))at(id)};document.getElementById('tabs').appendChild(el);s('tab-create',{tabId:id,url:url||null});at(id);if(!url)showHome()}
          function at(id){aTab=id;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.id==='TT'+id));s('tab-activate',{tabId:id});const u=tm[id]?.url||'cloud://home';document.getElementById('ui').value=u;sp(u);if(u==='cloud://home')showHome();else hidHome()}
          function ct(e,id){e.stopPropagation();if(Object.keys(tm).length===1){showHome();return}s('tab-close',{tabId:id});document.getElementById('TT'+id)?.remove();delete tm[id];if(aTab===id){const r=Object.keys(tm);at(r[r.length-1])}}
          function tl(id,t){const e=document.querySelector('#TT'+id+' .tl');if(e)e.textContent=(t||'Sekme').slice(0,22)}
          function navigate(){go(ru(document.getElementById('ui').value.trim()))}
          function hs(){const q=document.getElementById('si').value.trim();if(q)go(ru(q))}
          function go(url){if(!aTab)return;tm[aTab]={...(tm[aTab]||{}),url};document.getElementById('ui').value=url;sp(url);hidHome();ss('Yükleniyor: '+host(url),'var(--blue)');s('nav-go',{tabId:aTab,url})}
          function nav(a){if(!aTab)return;if(a==='home'){s('nav-home',{tabId:aTab});showHome()}else if(a==='reload')s('nav-reload',{tabId:aTab});else if(a==='back')s('nav-back',{tabId:aTab});else if(a==='fwd')s('nav-fwd',{tabId:aTab})}
          window.cb.on('nav-loading',({tabId,loading})=>{const t=document.getElementById('TT'+tabId);if(t)t.classList.toggle('loading',loading);if(tabId===aTab){const r=document.getElementById('br');r.textContent=loading?'✕':'↻';r.onclick=()=>s(loading?'nav-stop':'nav-reload',{tabId})}});
          window.cb.on('nav-update',({tabId,url,title,canBack,canFwd})=>{tm[tabId]={...(tm[tabId]||{}),url,title};tl(tabId,title||host(url));if(tabId===aTab){document.getElementById('ui').value=url;sp(url);document.getElementById('bb').classList.toggle('dis',!canBack);document.getElementById('bf').classList.toggle('dis',!canFwd);ss('Yüklendi: '+host(url))}});
          window.cb.on('nav-title',({tabId,title})=>{if(title)tl(tabId,title)});
          window.cb.on('nav-url',({tabId,url})=>{tm[tabId]={...(tm[tabId]||{}),url};if(tabId===aTab){document.getElementById('ui').value=url;sp(url)}});
          window.cb.on('nav-error',({tabId,error})=>{if(tabId===aTab)ss('Hata: '+error,'#ff6b6b')});
          window.cb.on('show-home',({tabId})=>{if(tabId===aTab)showHome()});
          window.cb.on('open-new-tab',({url})=>newTab(url));
          document.addEventListener('keydown',e=>{const m=e.ctrlKey||e.metaKey;if(m&&e.key==='t'){e.preventDefault();newTab()}if(m&&e.key==='w'){e.preventDefault();ct({stopPropagation:()=>{}},aTab)}if(m&&e.key==='r'){e.preventDefault();nav('reload')}if(m&&e.key==='l'){e.preventDefault();document.getElementById('ui').select()}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();nav('back')}if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();nav('fwd')}});
          newTab();
          </script>
          </body>
          </html>
          REOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npx electron-builder --linux --x64

      - name: Package as .wpk
        run: |
          VER="${{ github.run_number }}"
          zip -r "CloudBrowser-v${VER}.wpk" dist/
          echo "✅ CloudBrowser-v${VER}.wpk hazır"
          ls -lh *.wpk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudBrowser-v${{ github.run_number }}
          path: "*.wpk"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
