name: WindBrowser Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest   # Wine yok, doğrudan Windows runner

    steps:
      # ── 1. Kodu al ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python kur ─────────────────────────────────────────────────────
      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Bağımlılıkları kur ─────────────────────────────────────────────
      - name: PyQt5 ve PyInstaller kur
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5==5.15.10 PyQtWebEngine==5.15.6 pyinstaller==6.6.0

      # ── 4. .exe derle ─────────────────────────────────────────────────────
      - name: PyInstaller ile EXE derle
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --name WindBrowser `
            --distpath dist_win `
            windbrowser.py

      # ── 5. EXE kontrol ────────────────────────────────────────────────────
      - name: EXE dogrula
        run: |
          if (Test-Path "dist_win\WindBrowser.exe") {
            $size = (Get-Item "dist_win\WindBrowser.exe").Length / 1MB
            Write-Host ("WindBrowser.exe olustu: {0:N1} MB" -f $size)
          } else {
            Write-Error "WindBrowser.exe olusturulamadi!"
            exit 1
          }

      # ── 6. .wind paketi oluştur ───────────────────────────────────────────
      - name: WindBrowser.wind paketi olustur
        run: |
          New-Item -ItemType Directory -Force -Path wind_pkg\WindBrowser | Out-Null

          Copy-Item windbrowser.py wind_pkg\WindBrowser\windbrowser.py

          @"
          AppName: WindBrowser
          Version: 1.0.0
          Description: WindOS Web Tarayicisi
          Author: WindOS Project
          License: MIT
          MinOS: WindOS 1.0
          Requires: PyQt5, PyQtWebEngine
          "@ | Out-File -Encoding UTF8 wind_pkg\WindBrowser\manifest.txt

          @"
          WindBrowser v1.0 - WindOS Web Tarayicisi
          =========================================
          Kurulum : wind install WindBrowser.wind
          Calistir: python windbrowser.py
          "@ | Out-File -Encoding UTF8 wind_pkg\WindBrowser\README.txt

          # .wind = tar.gz (7-Zip ile)
          7z a -tgzip WindBrowser.wind wind_pkg\WindBrowser\*
          Write-Host "WindBrowser.wind olustu"

      # ── 7. Release zip ────────────────────────────────────────────────────
      - name: Release ZIP olustur
        run: |
          New-Item -ItemType Directory -Force -Path release_bundle | Out-Null

          Copy-Item dist_win\WindBrowser.exe release_bundle\WindBrowser.exe
          Copy-Item WindBrowser.wind         release_bundle\WindBrowser.wind

          @"
          WindBrowser v1.0 - Surum Notlari
          ==================================
          WindBrowser.exe  : Windows 10/11 icin calistirilebilir dosya
          WindBrowser.wind : WindOS icin kurulum paketi
          "@ | Out-File -Encoding UTF8 release_bundle\RELEASE_NOTES.txt

          Compress-Archive -Path release_bundle\* -DestinationPath WindBrowser-Release.zip
          $size = (Get-Item WindBrowser-Release.zip).Length / 1MB
          Write-Host ("Release ZIP: {0:N1} MB" -f $size)

      # ── 8. Artifact yükle ─────────────────────────────────────────────────
      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: WindBrowser-Release
          path: WindBrowser-Release.zip
          retention-days: 30

      # ── 9. Özet ───────────────────────────────────────────────────────────
      - name: Build ozeti
        run: |
          Write-Host ""
          Write-Host "WindBrowser.exe  : $((Get-Item dist_win\WindBrowser.exe).Length / 1MB -as [int]) MB"
          Write-Host "WindBrowser.wind : $((Get-Item WindBrowser.wind).Length / 1KB -as [int]) KB"
          Write-Host "Release.zip      : $((Get-Item WindBrowser-Release.zip).Length / 1MB -as [int]) MB"
          Write-Host "Build basarili!"
