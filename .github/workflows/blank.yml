name: CloudBrowser — Build & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: CloudBrowser
  WPK_VERSION: ${{ github.run_number }}

jobs:
  build:
    name: Build & Bundle (.wpk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build production bundle
        run: npm run build

      - name: Create .wpk package
        run: |
          echo "📦 Packaging CloudBrowser v$WPK_VERSION into .wpk..."
          mkdir -p dist/package
          cp -r build/* dist/package/
          cat > dist/package/manifest.json << EOF
          {
            "name": "CloudBrowser",
            "version": "$WPK_VERSION",
            "extension": ".wpk",
            "theme": "cloud",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "author": "${{ github.actor }}"
          }
          EOF
          cd dist
          zip -r "../CloudBrowser_v${WPK_VERSION}.wpk" package/
          echo "✅ .wpk package created: CloudBrowser_v${WPK_VERSION}.wpk"

      - name: Upload .wpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudBrowser-${{ env.WPK_VERSION }}.wpk
          path: CloudBrowser_v${{ env.WPK_VERSION }}.wpk
          retention-days: 30

  release:
    name: Release .wpk
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download .wpk artifact
        uses: actions/download-artifact@v4
        with:
          name: CloudBrowser-${{ env.WPK_VERSION }}.wpk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.WPK_VERSION }}
          name: CloudBrowser v${{ env.WPK_VERSION }}
          body: |
            ☁️ **CloudBrowser** — Bulut Temalı Tarayıcı
            
            ### Bu sürümdeki yenilikler
            - `.wpk` paket formatı desteklendi
            - Bulut temalı arayüz iyileştirmeleri
            - Otomatik GitHub Actions build sistemi
            
            ### Kurulum
            `.wpk` dosyasını indirin ve CloudBrowser loader ile açın.
          files: "*.wpk"
          token: ${{ secrets.GITHUB_TOKEN }}
