name: CloudBrowser — Build .wpk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package → CloudBrowser.wpk
        run: |
          mkdir -p package
          cp index.html package/index.html
          cat > package/manifest.json << MANIFEST
          {
            "name": "CloudBrowser",
            "version": "${{ github.run_number }}",
            "extension": ".wpk",
            "theme": "cloud",
            "entry": "index.html",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${{ github.sha }}",
            "author": "${{ github.actor }}"
          }
          MANIFEST
          cd package && zip -r ../CloudBrowser.wpk . && cd ..
          echo "✅ CloudBrowser.wpk oluşturuldu"
          ls -lh CloudBrowser.wpk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudBrowser.wpk
          path: CloudBrowser.wpk

      - name: Create Release (sadece main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "☁️ CloudBrowser v${{ github.run_number }}"
          body: |
            ### ☁️ CloudBrowser v${{ github.run_number }}

            **Kurulum:** `CloudBrowser.wpk` dosyasını indirip `.zip` olarak aç, `index.html`'i tarayıcıda aç.

            **Özellikler:**
            - Gerçek iframe tabanlı web gezintisi
            - Çoklu sekme (Ctrl+T / Ctrl+W)
            - Geri / İleri / Yenile geçmişi
            - `cloud://` özel protokol
            - Bulut temalı animasyonlu arayüz
          files: CloudBrowser.wpk
