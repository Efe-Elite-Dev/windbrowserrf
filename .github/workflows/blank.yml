name: WindBrowser Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Kodu al ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python kur ─────────────────────────────────────────────────────
      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Wine + MinGW + bağımlılıklar ──────────────────────────────────
      - name: Sistem bağımlılıklarını kur
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wine64 wine32 \
            python3-pip \
            upx-ucl \
            zip

      # ── 4. Wine içine Python 3.11 kur ────────────────────────────────────
      - name: Wine Python kur
        run: |
          # Python 3.11 Windows kurucusunu indir
          curl -fsSL -o /tmp/python-311.exe \
            "https://www.python.org/ftp/python/3.11.9/python-3.11.9-amd64.exe"

          # Sessiz kurulum
          WINEDEBUG=fixme-all DISPLAY="" \
            wine /tmp/python-311.exe /quiet \
              InstallAllUsers=1 \
              PrependPath=1 \
              TargetDir="C:\\Python311" 2>/dev/null || true

          # pip güncelle
          WINEDEBUG=fixme-all DISPLAY="" \
            wine "C:\\Python311\\python.exe" -m pip install --upgrade pip --quiet 2>/dev/null

      # ── 5. PyQt5, PyQtWebEngine, PyInstaller kur ─────────────────────────
      - name: Wine içine PyQt5 ve PyInstaller kur
        run: |
          WINEDEBUG=fixme-all DISPLAY="" \
            wine "C:\\Python311\\python.exe" -m pip install \
              PyQt5==5.15.10 \
              PyQtWebEngine==5.15.6 \
              pyinstaller==6.6.0 \
              --quiet 2>/dev/null

      # ── 6. .exe derle (PyInstaller) ───────────────────────────────────────
      - name: PyInstaller ile .exe derle
        run: |
          WINEDEBUG=fixme-all DISPLAY="" \
            wine "C:\\Python311\\Scripts\\pyinstaller.exe" \
              --onefile \
              --noconsole \
              --name WindBrowser \
              --distpath dist_win \
              windbrowser.py 2>/dev/null

          # Kontrol
          if [ ! -f "dist_win/WindBrowser.exe" ]; then
            echo "HATA: WindBrowser.exe olusturulamadi!" >&2
            exit 1
          fi
          echo "WindBrowser.exe boyutu: $(du -sh dist_win/WindBrowser.exe | cut -f1)"

      # ── 7. .wind paketi oluştur (.tar.gz mantığında) ──────────────────────
      - name: WindBrowser.wind paketi olustur
        run: |
          mkdir -p wind_pkg/WindBrowser

          # Uygulama dosyası
          cp windbrowser.py wind_pkg/WindBrowser/windbrowser.py

          # manifest.txt
          cat > wind_pkg/WindBrowser/manifest.txt << 'MANIFEST'
          AppName: WindBrowser
          Version: 1.0.0
          Description: WindOS Web Tarayicisi
          Author: WindOS Project
          License: MIT
          MinOS: WindOS 1.0
          Requires: PyQt5, PyQtWebEngine
          MANIFEST

          # README
          cat > wind_pkg/WindBrowser/README.txt << 'README'
          WindBrowser v1.0 - WindOS Web Tarayicisi
          ==========================================
          Kurulum:
            wind install WindBrowser.wind
          Calistirma:
            python windbrowser.py
          README

          # .wind = .tar.gz
          cd wind_pkg
          tar -czf ../WindBrowser.wind WindBrowser/
          cd ..

          echo "WindBrowser.wind boyutu: $(du -sh WindBrowser.wind | cut -f1)"

      # ── 8. Her şeyi zip'e topla ───────────────────────────────────────────
      - name: Artifact zip olustur
        run: |
          mkdir -p release_bundle

          cp dist_win/WindBrowser.exe release_bundle/WindBrowser.exe
          cp WindBrowser.wind         release_bundle/WindBrowser.wind

          # Sürüm notu
          cat > release_bundle/RELEASE_NOTES.txt << 'NOTES'
          WindBrowser v1.0 - Surum Paketi
          ================================
          WindBrowser.exe  : Windows 10/11 icin calistirilebilir dosya
          WindBrowser.wind : WindOS icin kurulum paketi

          Kullanim:
            Windows : WindBrowser.exe dosyasini calistirin
            WindOS  : wind install WindBrowser.wind komutunu kullanin
          NOTES

          cd release_bundle
          zip -r ../WindBrowser-Release.zip .
          cd ..

          echo "Release zip boyutu: $(du -sh WindBrowser-Release.zip | cut -f1)"

      # ── 9. Artifact yukle ─────────────────────────────────────────────────
      - name: Artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: WindBrowser-Release
          path: WindBrowser-Release.zip
          retention-days: 30

      # ── 10. Ozet ─────────────────────────────────────────────────────────
      - name: Build ozeti
        run: |
          echo ""
          echo "╔══════════════════════════════════════╗"
          echo "║  WindBrowser Build Tamamlandi!       ║"
          echo "╠══════════════════════════════════════╣"
          echo "║  WindBrowser.exe  : $(du -sh dist_win/WindBrowser.exe | cut -f1)"
          echo "║  WindBrowser.wind : $(du -sh WindBrowser.wind | cut -f1)"
          echo "║  Release.zip      : $(du -sh WindBrowser-Release.zip | cut -f1)"
          echo "╚══════════════════════════════════════╝"
